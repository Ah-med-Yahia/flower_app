name: flower_app
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

    # Localization
  easy_localization: ^3.0.8

  # UI and Design
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3

  # Splash screen
  flutter_native_splash: ^2.4.7

  # State management
  flutter_bloc: ^9.1.1

  # navigation
  go_router: ^17.0.1

  # Dependency Injection
  get_it: ^9.2.0
  injectable: ^2.7.1+4

  # API requests
  dio: ^5.9.0
  retrofit: ^4.9.2

  # JSON serialization
  json_annotation: ^4.9.0

  # Local storage
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0

  # Lottie
  lottie: ^3.3.2
  geolocator: ^14.0.2
  google_fonts: ^6.3.3
  fluttertoast: ^9.0.0

  equatable: ^2.0.7
  freezed_annotation: ^3.0.0
  pinput: ^6.0.1
  carousel_slider: ^5.1.1

  rename_app: ^1.6.5

  # Debugging
  logger: ^2.6.2
  pretty_dio_logger: ^1.4.0
  shimmer: ^3.0.0
  latlong2: ^0.9.1
  flutter_map: ^8.2.2
  geocoding: ^4.0.0
  webview_flutter: ^4.13.1
  skeletonizer: ^2.1.2
  firebase_core: ^4.4.0
  firebase_crashlytics: ^5.0.7
  firebase_analytics: ^12.1.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation tools
  build_runner: ^2.6.0
  freezed: ^3.0.0
  injectable_generator: ^2.7.0
  json_serializable: ^6.7.1
  retrofit_generator: ^10.0.1 
  flutter_gen_runner: ^5.9.0
  mockito: ^5.5.1
    
  bloc_test: ^10.0.0
  test: ^1.26.3

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/icons/
    - assets/files/
    - assets/images/
    - assets/cities.json
    - assets/states.json
    - assets/translations/

flutter_gen:
  output: lib/core/gen/
  integrations:
    lottie: true
    flutter_svg: true
  assets:
    enabled: true
    outputs:
      package_parameter_enabled: false
