name: Validate PR Title

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize

jobs:
  validate_pr_title:
    runs-on: ubuntu-latest
    
    timeout-minutes: 5
    concurrency:
      group: pr-title-validation-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Validate PR title format
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: true
          subjectPattern: ^[A-Z].+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            starts with an uppercase character.
          wip: false
          validateSingleCommit: false
          validateSingleCommitMatchesPrTitle: false

      - name: PR title validation success
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        if: success()
        run: |
          echo "PR title is valid and follow conventional commit format"
          echo "Title: $PR_TITLE"