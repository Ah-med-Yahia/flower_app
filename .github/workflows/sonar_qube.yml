name: Flutter CI + SonarCloud

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize

jobs:
  sonar_qube:
    runs-on: ubuntu-latest

    timeout-minutes: 5
    concurrency:
      group: sonar_qube-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Convert lcov to Sonar generic coverage
        run: |
          python3 - << 'PY'
          import re, os, xml.etree.ElementTree as ET

          lcov_path = "coverage/lcov.info"
          out_path = "coverage/sonar-generic-coverage.xml"

          if not os.path.exists(lcov_path):
            raise SystemExit(f"Missing {lcov_path}")

          root = ET.Element("coverage", version="1")
          current_file = None
          file_el = None

          sf_re = re.compile(r"^SF:(.+)$")
          da_re = re.compile(r"^DA:(\d+),(\d+).*$")

          with open(lcov_path, "r", encoding="utf-8", errors="ignore") as f:
            for line in f:
              line = line.strip()
              m = sf_re.match(line)
              if m:
                current_file = m.group(1)
                file_el = ET.SubElement(root, "file", path=current_file)
                continue

              m = da_re.match(line)
              if m and file_el is not None:
                ln = int(m.group(1))
                hits = int(m.group(2))
                ET.SubElement(file_el, "lineToCover", lineNumber=str(ln), covered="true" if hits > 0 else "false")

          tree = ET.ElementTree(root)
          ET.indent(tree, space="  ")
          os.makedirs(os.path.dirname(out_path), exist_ok=True)
          tree.write(out_path, encoding="utf-8", xml_declaration=True)
          print(f"Generated {out_path}")
          PY

      - name: Verify generic coverage
        run: |
          ls -la coverage
          head -n 20 coverage/sonar-generic-coverage.xml

      - name: Sonar Scan (SonarCloud)
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io